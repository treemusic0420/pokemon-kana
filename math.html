<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たしざん</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.groups{display:flex;align-items:center;justify-content:center;gap:12px;margin:24px 0}.group{display:flex;flex-wrap:wrap;justify-content:center;flex:1;max-width:420px;gap:3px}.group img,.group span{width:clamp(25px,5vw,48px);height:clamp(25px,5vw,48px);object-fit:contain;font-size:30px}.equation{font-size:clamp(36px,8vw,72px);font-weight:bold;margin:20px 0}.choices{display:flex;justify-content:center;gap:12px}.choices button{min-width:85px;font-size:36px;background:#fff;border:2px solid #b5aa91}.choices button.right{background:#d5efda;border-color:#37864b}.choices button.wrong{background:#fbe0dc;border-color:#c66}#feedback{min-height:42px;font-size:24px;font-weight:bold}#next,#restart{background:#bde4c6}[hidden]{display:none!important}</style></head><body><main><header><a href="./?v=12">〈 ホーム</a><h1>たしざん（20まで）</h1><b id="count"></b></header><progress id="progress" max="10"></progress><section id="game"><div class="groups"><div class="group" id="left"></div><strong style="font-size:36px">＋</strong><div class="group" id="right"></div></div><div class="equation" id="equation"></div><p>ただしい こたえを えらんでね！</p><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>つぎのもんだい →</button></section><section id="done" hidden><div style="font-size:100px">🏆</div><h2>よくできました！</h2><p>10もん クリア！</p><button id="restart">もういちど</button> <a href="./?v=12">ホームへ</a></section><small>Ver.0.12<br>Image source: <a href="https://github.com/PokeAPI/sprites">PokéAPI sprites</a>.<br>This is an unofficial, non-commercial educational project intended for personal and family use.<br>Pokémon and related characters belong to their respective copyright holders.</small></main><script>const $=id=>document.getElementById(id);const ids=[133,25,143,393,4,7,1,52,39,54,151];const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let questions=[],n=0,solved=false;function start(){const pool=[];for(let a=1;a<=19;a++)for(let b=a;b<=20-a;b++)pool.push(Math.random()<.5?[a,b]:[b,a]);questions=shuffle(pool.filter(([a,b])=>a+b>10)).slice(0,10);n=0;$('done').hidden=true;$('game').hidden=false;show()}function pictures(el,count,id){el.replaceChildren();for(let i=0;i<count;i++){const img=new Image();img.alt='';img.draggable=false;img.onerror=()=>{const s=document.createElement('span');s.textContent='●';img.replaceWith(s)};img.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+id+'.png';el.append(img)}}function show(){solved=false;const [a,b]=questions[n],sum=a+b;const id=ids[Math.floor(Math.random()*ids.length)];pictures($('left'),a,id);pictures($('right'),b,id);$('count').textContent=(n+1)+' / 10';$('progress').value=n;$('equation').textContent=a+' ＋ '+b+' ＝ ？';$('feedback').textContent='';$('next').hidden=true;$('choices').replaceChildren();const wrong=shuffle([sum-2,sum-1,sum+1,sum+2].filter(x=>x>=1&&x<=20)).slice(0,2);for(const value of shuffle([sum,...wrong])){const btn=document.createElement('button');btn.textContent=value;btn.onclick=()=>{if(solved)return;if(value===sum){solved=true;btn.className='right';$('feedback').textContent='⭕ せいかい！';$('next').hidden=false;for(const x of $('choices').children)x.disabled=true}else{btn.className='wrong';$('feedback').textContent='もういちど かんがえてみよう！';btn.disabled=true}};$('choices').append(btn)}}$('next').onclick=()=>{if(!solved)return;if(++n===10){$('progress').value=10;$('game').hidden=true;$('done').hidden=false}else show()};$('restart').onclick=start;start();</script></body></html>
