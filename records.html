<!doctype html><html lang="ja"><head><link rel="manifest" href="manifest.webmanifest?v=39"><link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ポケモン学習"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff8e5"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>がくしゅうきろく</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center}main{max-width:760px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(20px,4vw,30px)}a{color:inherit}button{background:#f8c74e;color:#514126;border:0;border-radius:12px;padding:12px;font-size:18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:24px 0}#month{font-size:24px;font-weight:bold}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{font-weight:bold;padding:6px 0}.day{background:white;border:1px solid #ded5c2;border-radius:9px;min-height:70px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}.day.today{border:2px solid #c48a23}.day.studied{background:#e2f3dc}.mark{font-size:24px}.empty{min-height:0}small{display:block;margin:24px 0;color:#766c59}@media(max-width:420px){main{padding:12px}.day{min-height:54px}.mark{font-size:20px}button{font-size:15px;padding:9px}#month{font-size:19px}}</style></head><body><main><div style="display:flex;justify-content:flex-end"><button id="bgm" style="font-size:14px;padding:8px 12px;background:#efd9f4;border-radius:12px" aria-pressed="true">🎵 BGM ON</button></div><header><a href="./?v=39">〈ホーム</a><h1>がくしゅうきろく</h1><span></span></header><div style="margin:12px auto"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/506.png" alt="ヨーテリー" draggable="false" style="width:140px;max-width:40%;height:auto;object-fit:contain"></div><div class="nav"><button id="prev">← まえの月</button><span id="month"></span><button id="next">つぎの月 →</button></div><p id="total"></p><div class="calendar" id="calendar"></div><p>⭕️ おべんきょう がんばった日</p><p id="error" role="alert"></p><small>Ver.0.39<br>2026年11月〜2027年10月<br>このブラウザに記録を保存します。</small></main><script>const $=id=>document.getElementById(id);const now=new Date();let offset=Math.max(0,Math.min(11,(now.getFullYear()-2026)*12+now.getMonth()-10));const dateKey=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');function render(){const first=new Date(2026,10+offset,1),y=first.getFullYear(),m=first.getMonth(),days=new Date(y,m+1,0).getDate();$('month').textContent=y+'年 '+(m+1)+'月';$('prev').disabled=offset===0;$('next').disabled=offset===11;const grid=$('calendar');grid.replaceChildren();for(const w of ['日','月','火','水','木','金','土']){const e=document.createElement('div');e.className='weekday';e.textContent=w;grid.append(e)}for(let i=0;i<first.getDay();i++){const e=document.createElement('div');e.className='empty';grid.append(e)}let count=0;$('error').textContent='';for(let d=1;d<=days;d++){const e=document.createElement('div');e.className='day';e.textContent=d;if(y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate())e.classList.add('today');try{if(localStorage.getItem('pokemon-kana-study-days-v1:'+dateKey(y,m,d))==='1'){count++;e.classList.add('studied');const mark=document.createElement('span');mark.className='mark';mark.textContent='⭕️';e.append(mark)}}catch(err){$('error').textContent='学習記録を読み込めませんでした。'}grid.append(e)}$('total').textContent='こんげつ：'+count+'日 がんばったね！'}$('prev').onclick=()=>{if(offset>0){offset--;render()}};$('next').onclick=()=>{if(offset<11){offset++;render()}};window.addEventListener('pageshow',render);render();</script><script>(()=>{const btn=document.getElementById('bgm');let ctx,timer,playing=false,wanted=true;try{wanted=localStorage.getItem('pokemon-bgm')!=='off'}catch(e){}const bass=[50,45,47,42,43,38,43,45],chords=[[62,66,69],[61,64,69],[59,62,66],[57,61,66],[59,62,67],[57,62,66],[59,62,67],[57,61,64]],melody=[[78,76],[74,73],[71,69],[71,73],[74,73],[71,69],[67,66],[67,69],[74,73,71,69],[67,66,67,64],[66,69,66,64],[62,66,69,71],[67,71,69,67],[66,69,74,73],[71,67,69,71],[73,71,69,73]];let bar=0,next=0;function tone(n,t,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.25);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.3)}function tick(){if(!playing)return;while(next<ctx.currentTime+.25){const i=bar%8;const beat=.68;tone(bass[i],next,.025);chords[i].forEach((n,j)=>tone(n,next+j*beat/2,.018));const notes=melody[bar%16];notes.forEach((n,j)=>tone(n,next+j*beat*2/notes.length,.045));next+=beat*2;bar++}}function label(){btn.textContent=playing?'🎵 BGM ON':wanted?'🎵 BGM ON ▶':'🎵 BGM OFF';btn.setAttribute('aria-pressed',String(playing))}async function start(){if(playing||document.hidden)return;try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(ctx.state!=='running'||!wanted||document.hidden||playing)return;playing=true;bar=0;next=ctx.currentTime+.05;tick();timer=setInterval(tick,100);label()}catch(e){label()}}function stop(){playing=false;clearInterval(timer);if(ctx)ctx.suspend().catch(()=>{});label()}btn.onclick=()=>{wanted=!playing;try{localStorage.setItem('pokemon-bgm',wanted?'on':'off')}catch(e){}if(wanted)start();else stop();label()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(wanted)start()});window.addEventListener('pagehide',stop);window.addEventListener('pageshow',()=>{if(wanted)start()});document.addEventListener('pointerdown',e=>{if(e.target!==btn&&wanted&&!playing)start()});label();if(wanted)start();})();</script></body></html>
