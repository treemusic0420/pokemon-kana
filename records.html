<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>がくしゅうきろく</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center}main{max-width:760px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(20px,4vw,30px)}a{color:inherit}button{background:#f8c74e;color:#514126;border:0;border-radius:12px;padding:12px;font-size:18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:24px 0}#month{font-size:24px;font-weight:bold}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{font-weight:bold;padding:6px 0}.day{background:white;border:1px solid #ded5c2;border-radius:9px;min-height:70px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}.day.today{border:2px solid #c48a23}.day.studied{background:#e2f3dc}.mark{font-size:24px}.empty{min-height:0}small{display:block;margin:24px 0;color:#766c59}@media(max-width:420px){main{padding:12px}.day{min-height:54px}.mark{font-size:20px}button{font-size:15px;padding:9px}#month{font-size:19px}}</style></head><body><main><header><a href="./?v=13">〈ホーム</a><h1>がくしゅうきろく</h1><span></span></header><div class="nav"><button id="prev">← まえの月</button><span id="month"></span><button id="next">つぎの月 →</button></div><p id="total"></p><div class="calendar" id="calendar"></div><p>⭕️ おべんきょう がんばった日</p><p id="error" role="alert"></p><small>Ver.0.13<br>2026年11月〜2027年10月<br>このブラウザに記録を保存します。</small></main><script>const $=id=>document.getElementById(id);const now=new Date();let offset=Math.max(0,Math.min(11,(now.getFullYear()-2026)*12+now.getMonth()-10));const dateKey=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');function render(){const first=new Date(2026,10+offset,1),y=first.getFullYear(),m=first.getMonth(),days=new Date(y,m+1,0).getDate();$('month').textContent=y+'年 '+(m+1)+'月';$('prev').disabled=offset===0;$('next').disabled=offset===11;const grid=$('calendar');grid.replaceChildren();for(const w of ['日','月','火','水','木','金','土']){const e=document.createElement('div');e.className='weekday';e.textContent=w;grid.append(e)}for(let i=0;i<first.getDay();i++){const e=document.createElement('div');e.className='empty';grid.append(e)}let count=0;$('error').textContent='';for(let d=1;d<=days;d++){const e=document.createElement('div');e.className='day';e.textContent=d;if(y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate())e.classList.add('today');try{if(localStorage.getItem('pokemon-kana-study-days-v1:'+dateKey(y,m,d))==='1'){count++;e.classList.add('studied');const mark=document.createElement('span');mark.className='mark';mark.textContent='⭕️';e.append(mark)}}catch(err){$('error').textContent='学習記録を読み込めませんでした。'}grid.append(e)}$('total').textContent='こんげつ：'+count+'日 がんばったね！'}$('prev').onclick=()=>{if(offset>0){offset--;render()}};$('next').onclick=()=>{if(offset<11){offset++;render()}};window.addEventListener('pageshow',render);render();</script></body></html>
