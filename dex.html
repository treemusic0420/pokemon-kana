<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まいにち おべんきょう</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:32px auto;max-width:700px}.tile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 10px;background:#ffe3a0}.tile:nth-child(3){background:#d5efda}.tile:nth-child(4){background:#dce7fa}@media(max-width:480px){.tiles{grid-template-columns:1fr}.tile{padding:18px 10px}}.tile:nth-child(2){background:#efd9f4}.symbol{font-size:clamp(30px,7vw,60px)}.tile span:last-child{font-size:16px}.home-title{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.home-title h1{font-size:clamp(20px,4.5vw,32px);margin:0}.home-title img{width:clamp(65px,15vw,120px);height:auto;object-fit:contain;flex-shrink:0}.tile:nth-child(5){background:#d9e9fa}.tile:nth-child(6){background:#ffd9bd}.tile:nth-child(7){background:#e4ecd1;grid-column:1/-1}.musicbar{display:flex;justify-content:flex-end}.musicbar button{font-size:14px;padding:9px 14px;background:#efd9f4} .dexgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.dexitem{background:white;border:1px solid #ddd;border-radius:12px;padding:8px;min-height:130px}.dexitem img{width:90px;height:90px;object-fit:contain}.dexitem b{display:block}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.controls button{font-size:16px;padding:10px}</style></head><body><main><header><a href="./?v=21">〈 ホーム</a><h1>ポケモンずかん</h1></header><h2 id="total"></h2><progress id="progress" max="1025"></progress><div class="controls"><button id="owned">なかまだけ</button><button id="all">ぜんぶ</button></div><p id="page"></p><div class="dexgrid" id="grid"></div><div class="controls"><button id="prev">← まえ</button><button id="next">つぎ →</button></div><p><a href="settings.html?v=21">⚙ バックアップ</a></p><small>Ver.0.21 · Images: PokéAPI sprites · Unofficial personal educational project</small></main><script src="collection.js?v=21"></script><script>const S=PokeStore,$=id=>document.getElementById(id);let all=false,page=0;function render(){const a=S.read(),set=new Set(a.map(x=>x.id)),ids=all?Array.from({length:S.MAX},(_,i)=>i+1):a.map(x=>x.id).sort((a,b)=>a-b);$('total').textContent=a.length+' / '+S.MAX+' ひき';$('progress').value=a.length;const pages=Math.max(1,Math.ceil(ids.length/48));page=Math.min(page,pages-1);$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('grid').replaceChildren();for(const id of ids.slice(page*48,page*48+48)){const e=document.createElement('div');e.className='dexitem';const num=document.createElement('small');num.style.margin='0';num.textContent='No.'+String(id).padStart(4,'0');const n=document.createElement('b');n.textContent=set.has(id)?'…':'？？？';e.append(num);if(set.has(id)){e.append(S.picture(id));S.name(id).then(v=>n.textContent=v)}else{const q=document.createElement('div');q.style.cssText='font-size:48px;color:#aaa';q.textContent='？';e.append(q)}e.append(n);$('grid').append(e)}if(!ids.length)$('grid').textContent='べんきょうして ポケモンを なかまにしよう！'}$('owned').onclick=()=>{all=false;page=0;render()};$('all').onclick=()=>{all=true;page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();</script></body></htm
