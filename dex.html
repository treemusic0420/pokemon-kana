<!doctype html><html lang="ja"><head><link rel="manifest" href="manifest.webmanifest?v=63"><link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ポケモン学習"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff8e5"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まいにち おべんきょう</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:32px auto;max-width:700px}.tile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 10px;background:#ffe3a0}.tile:nth-child(3){background:#d5efda}.tile:nth-child(4){background:#dce7fa}@media(max-width:480px){.tiles{grid-template-columns:1fr}.tile{padding:18px 10px}}.tile:nth-child(2){background:#efd9f4}.symbol{font-size:clamp(30px,7vw,60px)}.tile span:last-child{font-size:16px}.home-title{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.home-title h1{font-size:clamp(20px,4.5vw,32px);margin:0}.home-title img{width:clamp(65px,15vw,120px);height:auto;object-fit:contain;flex-shrink:0}.tile:nth-child(5){background:#d9e9fa}.tile:nth-child(6){background:#ffd9bd}.tile:nth-child(7){background:#e4ecd1;grid-column:1/-1}.musicbar{display:flex;justify-content:flex-end}.musicbar button{font-size:14px;padding:9px 14px;background:#efd9f4} .dexgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.dexitem{background:white;border:1px solid #ddd;border-radius:12px;padding:8px;min-height:130px}.dexitem img{width:90px;height:90px;object-fit:contain}.dexitem b{display:block}.dexitem .english-name{display:block;font-size:13px;color:#766c59;overflow-wrap:anywhere}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.controls button{font-size:16px;padding:10px} .dexitem.unlocked{cursor:pointer}.detail{background:#fff8e5;color:#514126;border:2px solid #e5ad45;border-radius:20px;width:min(94%,600px);max-height:90vh;overflow:auto;padding:20px}.detail::backdrop{background:#0008}.detail button{font-size:16px;padding:10px}.detail #cry{background:white;display:block;margin:auto}.detail #cry img{width:160px;height:160px;object-fit:contain}.detail h2{margin:8px}.detail .facts{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}.detail #evolutions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.detail #evolutions div{background:white;border-radius:12px;padding:8px;width:110px}.detail #evolutions img{width:80px;height:80px;object-fit:contain}.detail #evolutions span{display:block;font-size:13px}.detail p{line-height:1.6}.party-mark{color:#39734b;font-size:12px;display:block}.party-toggle{background:#d5efda!important;margin:8px}.party-toggle[aria-pressed=true]{background:#ffe3a0!important}</style></head><body><main><div class="musicbar"><button id="bgm" aria-pressed="true">🎵 BGM ON</button></div><header><a href="./?v=63">〈 ホーム</a><h1>ポケモンずかん</h1></header><h2 id="total"></h2><p id="partyCount"></p><p>ポケモンをタップして パーティーに いれよう！</p><progress id="progress" max="1025"></progress><div class="controls"><button id="partyOnly">パーティーだけ</button><button id="owned">なかまだけ</button><button id="all">ぜんぶ</button></div><p><label>ちほう： <select id="regionFilter" style="font-size:18px;padding:8px"><option value="-1">ぜんちほう</option></select></label></p><p id="regionDex"></p><p id="page"></p><div class="dexgrid" id="grid"></div><div class="controls"><button id="prev">← まえ</button><button id="next">つぎ →</button></div><p><a href="settings.html?v=63">⚙ バックアップ</a></p><small>Ver.0.63 · Images: PokéAPI sprites · Unofficial personal educational project</small><dialog id="detail" class="detail"><button id="closeDetail">← ずかんへ</button><p id="detailNum"></p><button id="cry" disabled aria-label="なきごえをきく"></button><p id="cryStatus" role="status">🔊 絵をタップして なきごえをきこう！</p><h2 id="detailJa"></h2><div id="detailEn" lang="en"></div><p id="growth"></p><progress id="xp" max="100"></progress><p id="evolveStatus" role="status"></p><button id="partyToggle" class="party-toggle"></button><p id="partyStatus" role="status"></p><p><a id="tradeLink">🔄 こうかんに だす</a></p><p id="genus"></p><p id="types"></p><div class="facts"><b id="height"></b><b id="weight"></b></div><p id="description"></p><h3>しんか</h3><div id="evolutions"></div><p id="detailStatus" role="status"></p></dialog></main><script src="collection.js?v=63"></script><script>const S=PokeStore,$=id=>document.getElementById(id);let all=false,partyOnly=true,page=0;for(const [i,r] of S.regions.entries()){const o=document.createElement('option');o.value=i;o.textContent=r[0];$('regionFilter').append(o)}$('regionFilter').onchange=()=>{page=0;render()};function render(){for(const [k,on] of [['partyOnly',partyOnly],['owned',!partyOnly&&!all],['all',all]]){$(k).setAttribute('aria-pressed',String(on));$(k).style.background=on?'#b9dfbf':''}const party=S.party();$('partyCount').textContent='パーティー '+party.length+' / 6 ひき';const a=S.read(),set=new Set(a.map(x=>x.id)),ids=(partyOnly?party:all?Array.from({length:S.MAX},(_,i)=>i+1):a.map(x=>x.id).sort((a,b)=>a-b)).filter(id=>partyOnly||Number($('regionFilter').value)<0||S.inRegion(id,Number($('regionFilter').value)));const rn=Number($('regionFilter').value),rr=S.regions[rn];$('regionFilter').disabled=partyOnly;$('regionDex').textContent=!partyOnly&&rr?rr[0]+'：'+a.filter(x=>S.inRegion(x.id,rn)).length+' / '+(rr[2]-rr[1]+1)+' ひき':'';$('total').textContent=a.length+' / '+S.MAX+' ひき';$('progress').value=a.length;const pages=Math.max(1,Math.ceil(ids.length/48));page=Math.min(page,pages-1);$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('grid').replaceChildren();for(const id of ids.slice(page*48,page*48+48)){const e=document.createElement('div');e.className='dexitem';const num=document.createElement('small');num.style.margin='0';num.textContent='No.'+String(id).padStart(4,'0');const n=document.createElement('b');n.textContent=set.has(id)?'…':'？？？';e.append(num);if(set.has(id)){e.classList.add('unlocked');e.tabIndex=0;e.setAttribute('role','button');e.setAttribute('aria-label','No.'+id+' の詳細');e.onclick=()=>openDetail(id);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openDetail(id)}};e.append(S.picture(id));const en=document.createElement('span');en.className='english-name';en.lang='en';S.names(id).then(v=>{n.textContent=v.ja;en.textContent=v.en});e.append(n,en);const lv=document.createElement('b');lv.textContent='Lv.'+S.level(a.find(x=>x.id===id));e.append(lv);if(partyOnly){const x=a.find(v=>v.id===id),p=document.createElement('progress'),t=document.createElement('span');p.max=100;p.value=S.level(x)===100?100:S.exp(x)%100;t.style.cssText='display:block;font-size:13px';t.textContent='EXP '+p.value+' / 100';const h=document.createElement('span');h.style.cssText='display:block;font-size:13px;color:#a34c68';h.textContent='♥ なつき度 '+S.friend(x)+' / 100';e.append(t,p,h)}if(party.includes(id)){const mark=document.createElement('span');mark.className='party-mark';mark.textContent='✓ パーティー中';e.append(mark)}}else{const q=document.createElement('div');q.style.cssText='font-size:48px;color:#aaa';q.textContent='？';e.append(q)}if(!set.has(id))e.append(n);$('grid').append(e)}if(!ids.length)$('grid').textContent=partyOnly?'なかまだけ から パーティーを えらんでね！':'べんきょうして ポケモンを なかまにしよう！'}$('partyOnly').onclick=()=>{partyOnly=true;all=false;page=0;render()};$('owned').onclick=()=>{partyOnly=false;all=false;page=0;render()};$('all').onclick=()=>{partyOnly=false;all=true;page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();let detailToken=0,audio=null,cryUrls=[];const cache=new Map();function getJSON(url){if(!cache.has(url)){cache.set(url,fetch(url).then(r=>{if(!r.ok)throw Error('API');return r.json()}).catch(e=>{cache.delete(url);throw e}))}return cache.get(url)}const api='https://pokeapi.co/api/v2/';const jpTypes={normal:'ノーマル',fire:'ほのお',water:'みず',electric:'でんき',grass:'くさ',ice:'こおり',fighting:'かくとう',poison:'どく',ground:'じめん',flying:'ひこう',psychic:'エスパー',bug:'むし',rock:'いわ',ghost:'ゴースト',dragon:'ドラゴン',dark:'あく',steel:'はがね',fairy:'フェアリー'};function jaEntry(a){return a?.find(x=>x.language.name==='ja-Hrkt')||a?.find(x=>x.language.name==='ja')}function stopCry(){if(audio){audio.pause();audio=null}}$('cry').onclick=async()=>{stopCry();const token=detailToken;for(const url of cryUrls){if(token!==detailToken)return;const a=new Audio(url);audio=a;try{await a.play();if(token!==detailToken)a.pause();return}catch(e){if(audio!==a)return}}if(token===detailToken)$('cryStatus').textContent='なきごえを 再生できませんでした。'};$('closeDetail').onclick=()=>$('detail').close();$('detail').addEventListener('close',()=>{detailToken++;stopCry()});function setupParty(id){const b=$('partyToggle'),refresh=()=>{const a=S.party(),on=a.includes(id);b.textContent=on?'− パーティーから はずす':'＋ パーティーに いれる';b.setAttribute('aria-pressed',String(on))};$('partyStatus').textContent='';refresh();b.onclick=()=>{try{const a=S.party();if(a.includes(id))S.saveParty(a.filter(x=>x!==id));else if(a.length>=6){$('partyStatus').textContent='6ひき いっぱいだよ。1ひき はずしてね！';return}else S.saveParty([...a,id]);$('partyStatus').textContent='へんこうしたよ！';refresh();render()}catch(e){$('partyStatus').textContent='保存できませんでした。'}}}async function openDetail(id){if(!S.read().some(x=>x.id===id))return;setupParty(id);const owned=S.read().find(x=>x.id===id);$('growth').textContent='Lv.'+S.level(owned)+' ／ EXP '+S.exp(owned)%100+' / 100 ／ なつき度 '+S.friend(owned)+' / 100';$('xp').value=S.level(owned)===100?100:S.exp(owned)%100;$('evolveStatus').textContent='';$('tradeLink').href='trade.html?v=63&id='+id;const token=++detailToken;stopCry();cryUrls=[];$('cry').disabled=true;$('cry').replaceChildren(S.picture(id));$('cryStatus').textContent='🔊 絵をタップして なきごえをきこう！';$('detailNum').textContent='No.'+String(id).padStart(4,'0');for(const k of ['detailJa','detailEn','genus','types','height','weight','description','evolutions'])$(k).textContent='';$('detailStatus').textContent='よみこみ中…';if(!$('detail').open)$('detail').showModal();const [p,s]=await Promise.allSettled([getJSON(api+'pokemon/'+id+'/'),getJSON(api+'pokemon-species/'+id+'/')]);if(token!==detailToken)return;if(p.status==='fulfilled'){const v=p.value;$('types').textContent='タイプ：'+v.types.map(t=>jpTypes[t.type.name]||t.type.name).join(' / ');$('height').textContent='たかさ '+v.height/10+' m';$('weight').textContent='おもさ '+v.weight/10+' kg';cryUrls=[...new Set([v.cries?.latest,v.cries?.legacy].filter(Boolean))];$('cry').disabled=!cryUrls.length;if(!cryUrls.length)$('cryStatus').textContent='なきごえのデータがありません。'}if(s.status==='fulfilled'){const v=s.value;$('detailJa').textContent=jaEntry(v.names)?.name||'No.'+id;$('detailEn').textContent=v.names.find(x=>x.language.name==='en')?.name||'';$('genus').textContent=jaEntry(v.genera)?.genus||'';const desc=[...v.flavor_text_entries].reverse();$('description').textContent=(jaEntry(desc)?.flavor_text||'').replace(/[\n\f]/g,' ');try{const chain=await getJSON(v.evolution_chain.url);if(token!==detailToken)return;const entries=[];function walk(n,depth){entries.push({species:n.species,depth,node:n});n.evolves_to.forEach(x=>walk(x,depth+1))}walk(chain.chain,0);if(entries.length===1)$('evolutions').textContent='しんかしない ポケモン';else for(const item of entries){const pid=Number(item.species.url.split('/').filter(Boolean).pop());const box=document.createElement('div'),label=document.createElement('span');label.textContent='No.'+pid;const stage=document.createElement('span');stage.textContent=(item.depth+1)+' だんかい';box.append(stage,S.picture(pid),label);if(pid===id)box.style.border='2px solid #e5ad45';const current=entries.find(e=>Number(e.species.url.split('/').filter(Boolean).pop())===id);if(current?.node.evolves_to.includes(item.node)){const rule=S.evolutionRule(id,pid,item.node,item.depth),{stone,required,affection}=rule;const b=document.createElement('button');const have=S.read().some(x=>x.id===pid);b.textContent=have?'なかま済み':'Lv.'+required+' でしんか';if(!have&&(stone||affection)){const req=document.createElement('span');req.textContent=stone?S.stones[stone]+'（'+(S.bag()[stone]||0)+'こ）':'なつき度 '+affection;box.append(req)}b.disabled=!S.canEvolve(owned,pid,rule);b.onclick=()=>{if(!confirm('しんかさせますか？ 元のポケモンも残ります。'))return;try{if(S.evolve(id,pid,required,stone,affection)){render();openDetail(pid);stopCry();const a=new Audio('https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/'+pid+'.ogg');audio=a;a.play().catch(()=>{if(audio===a)$('cryStatus').textContent='なきごえボタンを タップしてね！'});}}catch(e){$('evolveStatus').textContent='保存できませんでした。'}};box.append(b)}$('evolutions').append(box);S.names(pid).then(n=>label.textContent=n.ja)}}catch(e){if(token===detailToken)$('evolutions').textContent='しんか情報を取得できませんでした。'}}if(token===detailToken)$('detailStatus').textContent=p.status==='fulfilled'&&s.status==='fulfilled'?'':'一部の情報を取得できませんでした。'}</script><script>(()=>{const btn=document.getElementById('bgm');let ctx,timer,playing=false,wanted=true;try{wanted=localStorage.getItem('pokemon-bgm')!=='off'}catch(e){}const bass=[50,45,47,42,43,38,43,45],chords=[[62,66,69],[61,64,69],[59,62,66],[57,61,66],[59,62,67],[57,62,66],[59,62,67],[57,61,64]],melody=[[78,76],[74,73],[71,69],[71,73],[74,73],[71,69],[67,66],[67,69],[74,73,71,69],[67,66,67,64],[66,69,66,64],[62,66,69,71],[67,71,69,67],[66,69,74,73],[71,67,69,71],[73,71,69,73]];let bar=0,next=0;function tone(n,t,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.25);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.3)}function tick(){if(!playing)return;while(next<ctx.currentTime+.25){const i=bar%8;const beat=.68;tone(bass[i],next,.025);chords[i].forEach((n,j)=>tone(n,next+j*beat/2,.018));const notes=melody[bar%16];notes.forEach((n,j)=>tone(n,next+j*beat*2/notes.length,.045));next+=beat*2;bar++}}function label(){btn.textContent=playing?'🎵 BGM ON':wanted?'🎵 BGM ON ▶':'🎵 BGM OFF';btn.setAttribute('aria-pressed',String(playing))}async function start(){if(playing||document.hidden)return;try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(ctx.state!=='running'||!wanted||document.hidden||playing)return;playing=true;bar=0;next=ctx.currentTime+.05;tick();timer=setInterval(tick,100);label()}catch(e){label()}}function stop(){playing=false;clearInterval(timer);if(ctx)ctx.suspend().catch(()=>{});label()}btn.onclick=()=>{wanted=!playing;try{localStorage.setItem('pokemon-bgm',wanted?'on':'off')}catch(e){}if(wanted)start();else stop();label()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(wanted)start()});window.addEventListener('pagehide',stop);window.addEventListener('pageshow',()=>{if(wanted)start()});document.addEventListener('pointerdown',e=>{if(e.target!==btn&&wanted&&!playing)start()});label();if(wanted)start();})();</script></body></html>
