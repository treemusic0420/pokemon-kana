やってみよう","Let me try."],["ちょっと気になっただけ","I was just wondering."],["また連絡してね","Drop me a line."],["そうくるとは思わなかった","I didn't see that coming."],["ただ確認したかった","I just wanted to make sure."],["頑張りすぎないで","Don't push yourself too hard."],["意味分からないよね","Go figure."],["付き合うよ","I'll keep you company."],["やっぱりいいや","Forget it."],["何も思いつかない","I can't come up with anything."],["コーヒーにこだわりがある","I'm picky about coffee."],["全てはあなたのおかげです","It's all because of you."],["くつろいでください","Make yourself at home."],["慣れない","I can't get used to it."],["間違えた","I made a mistake."],["わかるわかる","I know what you mean."],["勘違いしないで","Don't get the wrong idea."],["ゴルフにはまってるんだ","I'm really into golf."],["今日はついてない","It's not my day."],["その調子で頑張って！","Keep it up!"],["それいいな","That must be nice."],["残念だ","It's a shame."],["やめた方がいいよ","You'd better not."],["これがいい","That's more like it."],["忘れられない","It was unforgettable."],["なんか怪しい","Something's fishy."],["埋め合わせするよ","I'll make it up to you."],["玄関先に誰か来たよ","Someone's at the door."],["昔は人がたくさんいた","There used to be a lot of people."],["彼女の名前も知らない","I don't even know her name."],["何百もの人がいた","There were hundreds of people."],["本当に感謝します","I really appreciate it."],["めんどくせぇ","What a pain."],["ホッとした","What a relief!"],["取り消すよ","I take it back."],["誤解しないで","Don't get me wrong."],["君の気持ち分かるよ","I know how you feel."],["めんどくさいよ","It's a lot of work."],["それが言いたかった","That's what I wanted to say."],["本当にするとは思わなかった","I didn't think you'd do it."],["観光客がほとんど","It's mostly tourists."],["独り占めできる","You can have it all to yourself."],["そういう人はたくさんいる","There are many people like that."],["フル活用したい","I want to make the most of it."],["できることはあまりない","There's not much you can do."],["正直になろうよ","Let's be honest."],["彼女にメールするように言われた","She asked me to text her."],["多分だめだって言うと思う","They'll probably say no."],["どんな感じかわからない","I don't know what it's like."],["先頭に立って案内して","Lead the way."],["人違いでした","I thought you were someone else."],["まだ続いている","It's still going on."],["何か忘れてると思った","I knew I forgot something."],["提案を歓迎するよ","I'm open to suggestions."],["またこの季節がやってきた","It's that time of year again."],["それは君の為にはならない","It won't do you any good."],["いろいろ考えた","I've been doing a lot of thinking."],["肩肘張らずにやろう","Let's keep it casual."],["必要性を感じなかった","I never saw the need."],["迷惑になりたくない","I don't want to be a nuisance."],["話し合ったほうがいいよ","You should talk it over."],["必要ないよ","There's no need."],["それはいい方法だ","That's a good strategy."],["まず着替えなきゃ","I have to change first."],["余りがある","There are some left over."],["なんか臭い","Something smells."],["最初から持っていた","I had it all along."],["する事がない","There's nothing to do."],["裏技がある","There's a trick to it."],["様子を見てみよう","Let's wait and see."],["迷惑でなければいいんだけど","I hope you don't mind."],["方法を見つける","I'll find a way."],["それは別","That doesn't count."],["という証拠だ","It goes to show."],["それは彼の得意な事","That's his thing."],["捨てていいよ","You can throw it out."],["自分で確かめて","See for yourself."],["まだそんなレベルじゃない","I'm not quite there yet."],["それを言うのはあなたらしくない","It's not like you to say that."],["見せかけだけ","It's just for show."],["あなたの責任だよ","It's all on you."],["手伝うよ","I'll help you out."],["考えさせられた","It got me thinking."],["心配することないよ","No need to worry."],["でも分からないよ","You never know."],["ちょっとチェックさせて","Let me check real quick."],["それとこれとは話が別","That's a different story."],["貸してあげるよ","I'll lend it to you."],["そうするつもりです","That's what I'm planning to do."],["あなただと分からなかった","I didn't recognize you."],["そこにいたんだ","There you are."],["ギリギリ間に合ったね","You're just in time."],["特に意味はない","It doesn't really mean anything."],["そんな時間ない","There's no time for that."],["この間はごめん","Sorry about the other day."],["それは信じ難い","I find that hard to believe."],["ただ遊びで","It's just for fun."],["目立つよ","You really stand out."],["嫌な予感がする","I have a bad feeling about this."],["迷惑になるので","I don't want to be a bother."],["いろいろあったんだ","I had a lot going on."],["まだ練習中だ","I'm still working on it."],["言ってることがわからない","You lost me there."],["今日はここまでです","That's all for today."],["動かない","It doesn't work."],["一番奥にあるよ","It's at the very back."],["もうすぐ出来るよ","It's almost ready."],["それは初耳だ","That's news to me."],["まっすぐ家に帰った","I went straight home."],["着替えなきゃ","I have to get changed."]];function start(){questions=shuffle([...bank]).slice(0,20);n=0;$('done').hidden=true;$('game').hidden=false;show()}function show(){solved=false;const [word,answer]=questions[n];const wrong=shuffle(bank.filter(q=>q[1]!==answer&&q[0]!==word)).slice(0,2).map(q=>q[1]);$('word').textContent=word;$('poke').src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+ids[Math.floor(Math.random()*ids.length)]+'.png';$('count').textContent=(n+1)+' / 20';$('progress').value=n;$('feedback').textContent='';$('choices').replaceChildren();for(const x of shuffle([answer,...wrong])){const b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(solved)return;if(x===answer){playSound('correct');solved=true;b.className='right';$('feedback').textContent='⭕ せいかい！';for(const c of $('choices').children)c.disabled=true;setTimeout(advance,500)}else{playSound('retry');b.className='wrong';b.disabled=true;$('feedback').textContent='もういちど かんがえてみよう！'}};$('choices').append(b)}}function advance(){if(!solved)return;if(++n===20){playSound('finish');$('progress').value=20;$('game').hidden=true;$('done').hidden=false;recordStudy();rewardPokemon()}else{playSound('next');show()}}$('restart').onclick=start;function recordStudy(){const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(day<'2026-11-01'||day>'2027-10-31')return;try{localStorage.setItem('pokemon-kana-study-days-v1:'+day,'1')}catch(e){console.warn('Study record unavailable',e);const msg=document.createElement('p');msg.textContent='学習記録を保存できませんでした。';$('done').append(msg)}}let audioCtx;function playSound(kind){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx ||= new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});const notes={next:[660],correct:[660,880],retry:[440,350],finish:[523,659,784,1047]}[kind];const t=audioCtx.currentTime;notes.forEach((hz,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),start=t+i*.13;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.001,start);g.gain.exponentialRampToValueAtTime(.12,start+.015);g.gain.exponentialRampToValueAtTime(.001,start+.16);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+.18)})}catch(e){console.warn('Audio unavailable',e)}}start();</script><script src="study-bgm.js?v=35" data-track="english"></script><script src="collection.js?v=35"></script></body></html>
