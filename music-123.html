<!doctype html><html lang="ja"><head><link rel="manifest" href="manifest.webmanifest?v=71"><link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ポケモン学習"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff8e5"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1・2・3</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.groups{display:flex;align-items:center;justify-content:center;gap:12px;margin:24px 0}.group{display:flex;flex-wrap:wrap;justify-content:center;flex:1;max-width:420px;gap:3px}.group img,.group span{width:clamp(25px,5vw,48px);height:clamp(25px,5vw,48px);object-fit:contain;font-size:30px}.equation{font-size:clamp(36px,8vw,72px);font-weight:bold;margin:20px 0}.choices{display:flex;justify-content:center;gap:12px}.choices button{min-width:85px;font-size:36px;background:#fff;border:2px solid #b5aa91}.choices button.right{background:#d5efda;border-color:#37864b}.choices button.wrong{background:#fbe0dc;border-color:#c66}#feedback{min-height:42px;font-size:24px;font-weight:bold}#next,#restart{background:#bde4c6}[hidden]{display:none!important}.clockrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto}.clockrow svg{width:min(65vw,340px);max-height:42vh}.clockrow img{width:min(22vw,130px)}.choices{flex-wrap:wrap}.choices button{font-size:clamp(18px,4vw,30px)}header h1{font-size:24px}.clockrow #word svg{width:100%;max-height:none}.choices button{min-width:95px}</style><style>#start,#restart{background:#bde4c6}#status{min-height:3em}button:disabled{opacity:.6;cursor:default}</style></head><body><main><header><a href="./?v=71">〈 ホーム</a><h1>1・2・3</h1><span></span></header><section id="game"><div style="font-size:76px">🎹</div><h2>さいごまで きこう！</h2><p>とちゅうで やめると はじめからだよ。</p><progress id="progress" max="1" value="0"></progress><p id="status" role="status">スタートを おしてね。</p><button id="start">▶ スタート</button> <button id="stop" hidden>やめる</button></section><section id="done" hidden><div style="font-size:80px">🏆</div><h2>よくできました！</h2><p>さいごまで きけたね！</p><button id="restart" disabled>もういちど</button> <a href="./?v=71">ホームへ</a></section><audio id="song" preload="auto" src="123.mp3"></audio><small>Ver.0.71</small></main><script src="collection.js?v=71"></script><script>
(()=>{const $=id=>document.getElementById(id),a=$('song'),start=$('start'),stop=$('stop'),game=$('game'),done=$('done'),progress=$('progress'),status=$('status'),restart=$('restart');let run=0,active=false,played=false,finishing=false;
function reset(message){run++;active=false;played=false;a.pause();try{a.currentTime=0}catch(e){}progress.value=0;start.disabled=false;stop.hidden=true;status.textContent=message}
function invalidate(){if(active)reset('とちゅうで とまったよ。はじめから きこう！')}
start.onclick=async()=>{if(active||finishing||document.hidden)return;const token=++run;active=true;played=false;start.disabled=true;stop.hidden=false;status.textContent='さいせい じゅんびちゅう…';try{a.playbackRate=1;if(a.currentTime!==0||a.seeking){reset('はじめから きこう！');return}await a.play();if(token!==run)return}catch(e){if(token===run)reset('さいせいできなかったよ。もういちど おしてね。')}};
stop.onclick=invalidate;a.addEventListener('playing',()=>{if(active){played=true;status.textContent='さいせいちゅう… さいごまで がんばろう！'}});
a.addEventListener('timeupdate',()=>{if(active&&Number.isFinite(a.duration)&&a.duration>0)progress.value=a.currentTime/a.duration});
a.addEventListener('seeking',()=>{if(active)invalidate()});a.addEventListener('ratechange',()=>{if(active&&a.playbackRate!==1)invalidate()});a.addEventListener('pause',()=>{if(active&&!a.ended)invalidate()});a.addEventListener('waiting',()=>{if(active&&played)invalidate()});a.addEventListener('error',()=>{if(active)reset('おんがくを よみこめなかったよ。もういちど おしてね。')});a.addEventListener('ended',async()=>{if(!active||!played||!a.ended||document.hidden||!Number.isFinite(a.duration)||a.currentTime<a.duration-.25||a.played.length!==1||a.played.start(0)>.25||a.played.end(0)<a.duration-.25){invalidate();return}active=false;finishing=true;run++;progress.value=1;game.hidden=true;done.hidden=false;restart.disabled=true;try{await rewardPokemon()}finally{finishing=false;restart.disabled=false}});
restart.onclick=()=>{if(finishing)return;done.querySelectorAll('.pokemon-reward').forEach(x=>x.remove());game.hidden=false;done.hidden=true;reset('スタートを おしてね。')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)invalidate()});window.addEventListener('pagehide',invalidate);window.addEventListener('beforeunload',invalidate);if(navigator.mediaSession){for(const action of ['seekbackward','seekforward','seekto','pause','stop','nexttrack','previoustrack']){try{navigator.mediaSession.setActionHandler(action,()=>{if(action==='pause'||action==='stop')invalidate()})}catch(e){}}}
})();
</script></body></html>
