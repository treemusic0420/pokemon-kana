<!doctype html><html lang="ja"><head><link rel="manifest" href="manifest.webmanifest?v=46"><link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ポケモン学習"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff8e5"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>とけい</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.groups{display:flex;align-items:center;justify-content:center;gap:12px;margin:24px 0}.group{display:flex;flex-wrap:wrap;justify-content:center;flex:1;max-width:420px;gap:3px}.group img,.group span{width:clamp(25px,5vw,48px);height:clamp(25px,5vw,48px);object-fit:contain;font-size:30px}.equation{font-size:clamp(36px,8vw,72px);font-weight:bold;margin:20px 0}.choices{display:flex;justify-content:center;gap:12px}.choices button{min-width:85px;font-size:36px;background:#fff;border:2px solid #b5aa91}.choices button.right{background:#d5efda;border-color:#37864b}.choices button.wrong{background:#fbe0dc;border-color:#c66}#feedback{min-height:42px;font-size:24px;font-weight:bold}#next,#restart{background:#bde4c6}[hidden]{display:none!important}.clockrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto}.clockrow svg{width:min(65vw,340px);max-height:42vh}.clockrow img{width:min(22vw,130px)}.choices{flex-wrap:wrap}.choices button{font-size:clamp(18px,4vw,30px)}header h1{font-size:24px}</style></head><body><main><div style="display:flex;justify-content:flex-end"><button id="bgm" style="font-size:14px;padding:8px 12px;background:#efd9f4;border-radius:12px" aria-pressed="true">🎵 BGM ON</button></div><header><a href="./?v=46">〈 ホーム</a><h1>とけい</h1><b id="count"></b></header><progress id="progress" max="20"></progress><section id="game"><div class="clockrow"><svg id="clock" viewBox="0 0 300 300" role="img" aria-label="アナログ時計"></svg><img id="poke" alt="" draggable="false"></div><h2>いま なんじ なんぷん？</h2><p>ただしい こたえを えらんでね！</p><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p></section><section id="done" hidden><div style="font-size:100px">🏆</div><h2>よくできました！</h2><p>20もん クリア！</p><button id="restart">もういちど</button> <a href="./?v=46">ホームへ</a></section><small>Ver.0.46<br>Image source: <a href="https://github.com/PokeAPI/sprites">PokéAPI sprites</a>.<br>This is an unofficial, non-commercial educational project intended for personal and family use.<br>Pokémon and related characters belong to their respective copyright holders.</small></main><script>const $=id=>document.getElementById(id),ids=[133,25,134,135,136,196,197,470,471,700,906,702];function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let questions=[],n=0,solved=false;let mistakes=0;function start(){mistakes=0;$('done').querySelectorAll('.pokemon-reward,.reward-denied').forEach(e=>e.remove());const pool=Array.from({length:720},(_,i)=>i);questions=[...shuffle(pool.filter(x=>x%60===0)).slice(0,4),...shuffle(pool.filter(x=>x%60!==0&&x%5===0)).slice(0,8),...shuffle(pool.filter(x=>x%5!==0)).slice(0,8)];n=0;$('done').hidden=true;$('game').hidden=false;show()}function draw(h,m){let out='<circle cx="150" cy="150" r="144" fill="#fff" stroke="#e5ad45" stroke-width="8"/>';for(let i=0;i<60;i++){const a=i*Math.PI/30,x=Math.sin(a),y=-Math.cos(a),r=i%5===0?122:130;out+='<line x1="'+(150+x*r)+'" y1="'+(150+y*r)+'" x2="'+(150+x*137)+'" y2="'+(150+y*137)+'" stroke="#514126" stroke-width="'+(i%5===0?3:1)+'"/>'}for(let i=1;i<=12;i++){const a=i*Math.PI/6;out+='<text x="'+(150+Math.sin(a)*103)+'" y="'+(150-Math.cos(a)*103)+'" text-anchor="middle" dominant-baseline="central" font-size="23" font-weight="bold" fill="#514126">'+i+'</text>'}out+='<line x1="150" y1="150" x2="150" y2="87" stroke="#e66b65" stroke-width="10" stroke-linecap="round" transform="rotate('+(h*30+m*.5)+' 150 150)"/><line x1="150" y1="150" x2="150" y2="38" stroke="#3978b9" stroke-width="6" stroke-linecap="round" transform="rotate('+(m*6)+' 150 150)"/><circle cx="150" cy="150" r="7" fill="#514126"/>';$('clock').innerHTML=out}function fmt(x){return (Math.floor(x/60)||12)+'時 '+x%60+'分'}function show(){solved=false;const v=questions[n],h=Math.floor(v/60),m=v%60;draw(h,m);$('poke').src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+ids[Math.floor(Math.random()*ids.length)]+'.png';$('count').textContent=(n+1)+' / 20';$('progress').value=n;$('feedback').textContent='';$('choices').replaceChildren();const wrong1=((h+1)%12)*60+m,wrong2=h*60+(m+(n<12?5:1))%60;for(const x of shuffle([v,wrong1,wrong2])){const b=document.createElement('button');b.textContent=fmt(x);b.onclick=()=>{if(solved)return;if(x===v){playSound('correct');solved=true;b.className='right';$('feedback').textContent='⭕ せいかい！';setTimeout(advance,500);for(const c of $('choices').children)c.disabled=true}else{mistakes++;playSound('retry');b.className='wrong';b.disabled=true;$('feedback').textContent='もういちど かんがえてみよう！'}};$('choices').append(b)}}function advance(){if(!solved)return;if(++n===20){playSound('finish');$('progress').value=20;$('game').hidden=true;$('done').hidden=false;recordStudy();if(mistakes<4)rewardPokemon();else{const p=document.createElement('p');p.className='reward-denied';p.textContent='まちがい '+mistakes+'かい。ポケモンを ゲットするには 3かいまで！ もういちど がんばろう！';$('done').append(p)}}else{playSound('next');show()}}$('restart').onclick=start;function recordStudy(){const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(day<'2026-11-01'||day>'2027-10-31')return;try{localStorage.setItem('pokemon-kana-study-days-v1:'+day,'1')}catch(e){console.warn('Study record unavailable',e);const msg=document.createElement('p');msg.textContent='学習記録を保存できませんでした。';$('done').append(msg)}}let audioCtx;function playSound(kind){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx ||= new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});const notes={next:[660],correct:[660,880],retry:[440,350],finish:[523,659,784,1047]}[kind];const t=audioCtx.currentTime;notes.forEach((hz,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),start=t+i*.13;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.001,start);g.gain.exponentialRampToValueAtTime(.12,start+.015);g.gain.exponentialRampToValueAtTime(.001,start+.16);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+.18)})}catch(e){console.warn('Audio unavailable',e)}}start();</script><script src="study-bgm.js?v=46" data-track="clock"></script><script src="collection.js?v=46"></script></body></html>
