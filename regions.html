<!doctype html><html lang="ja"><head><link rel="manifest" href="manifest.webmanifest?v=58"><link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ポケモン学習"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff8e5"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まいにち おべんきょう</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:32px auto;max-width:700px}.tile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 10px;background:#ffe3a0}.tile:nth-child(3){background:#d5efda}.tile:nth-child(4){background:#dce7fa}@media(max-width:480px){.tiles{grid-template-columns:1fr}.tile{padding:18px 10px}}.tile:nth-child(2){background:#efd9f4}.symbol{font-size:clamp(30px,7vw,60px)}.tile span:last-child{font-size:16px}.home-title{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.home-title h1{font-size:clamp(20px,4.5vw,32px);margin:0}.home-title img{width:clamp(65px,15vw,120px);height:auto;object-fit:contain;flex-shrink:0}.tile:nth-child(5){background:#d9e9fa}.tile:nth-child(6){background:#ffd9bd}.tile:nth-child(7){background:#e4ecd1}.musicbar{display:flex;justify-content:flex-end}.musicbar button{font-size:14px;padding:9px 14px;background:#efd9f4}.partygrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.partyslot{background:white;border:1px solid #ddd;border-radius:12px;padding:6px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}.partyslot img{width:100%;max-width:100px;aspect-ratio:1;object-fit:contain}.partyslot span{font-size:13px;overflow-wrap:anywhere}.partyslot.empty{border:1px dashed #b5aa91;background:transparent;color:#887b65;text-decoration:none}@media(max-width:600px){.partygrid{grid-template-columns:repeat(3,minmax(0,1fr))}}.category-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:700px;margin:24px auto}.category{width:100%;min-width:0;padding:24px 6px}.category-content{grid-column:1/-1;width:100%;margin:0 0 8px}.category-content[hidden]{display:none}.category[aria-expanded=true]{outline:3px solid #a78b54;outline-offset:-3px}.category-content .tile{padding:20px 8px}@media(min-width:481px){.category-list>.category{grid-row:1}.category-content{grid-row:2}}@media(max-width:480px){.category-list{grid-template-columns:1fr}.category{padding:16px 8px}.category-content{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><div class="musicbar"><button id="bgm">🎵 BGM ON</button></div><header><a href="./?v=58">〈 ホーム</a><h1>ぼうけんする ちほう</h1></header><p id="highest"></p><div id="regions" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"></div><p id="status" role="status"></p><small>Ver.0.58</small></main><script>const btn=document.getElementById('bgm');let ctx,timer,playing=false,wanted=true;try{wanted=localStorage.getItem('pokemon-bgm')!=='off'}catch(e){}const bass=[50,45,47,42,43,38,43,45],chords=[[62,66,69],[61,64,69],[59,62,66],[57,61,66],[59,62,67],[57,62,66],[59,62,67],[57,61,64]],melody=[[78,76],[74,73],[71,69],[71,73],[74,73],[71,69],[67,66],[67,69],[74,73,71,69],[67,66,67,64],[66,69,66,64],[62,66,69,71],[67,71,69,67],[66,69,74,73],[71,67,69,71],[73,71,69,73]];let bar=0,next=0;function tone(n,t,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.25);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.3)}function tick(){if(!playing)return;while(next<ctx.currentTime+.25){const i=bar%8;const beat=.68;tone(bass[i],next,.025);chords[i].forEach((n,j)=>tone(n,next+j*beat/2,.018));const notes=melody[bar%16];notes.forEach((n,j)=>tone(n,next+j*beat*2/notes.length,.045));next+=beat*2;bar++}}function label(){btn.textContent=playing?'🎵 BGM ON':wanted?'🎵 BGM ON ▶':'🎵 BGM OFF';btn.setAttribute('aria-pressed',String(playing))}async function start(){if(playing||document.hidden)return;try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(ctx.state!=='running'||!wanted||document.hidden||playing)return;playing=true;bar=0;next=ctx.currentTime+.05;tick();timer=setInterval(tick,100);label()}catch(e){label()}}function stop(){playing=false;clearInterval(timer);if(ctx)ctx.suspend().catch(()=>{});label()}btn.onclick=()=>{wanted=!playing;try{localStorage.setItem('pokemon-bgm',wanted?'on':'off')}catch(e){}if(wanted)start();else stop();label()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(wanted)start()});window.addEventListener('pagehide',stop);window.addEventListener('pageshow',()=>{if(wanted)start()});document.addEventListener('pointerdown',e=>{if(e.target!==btn&&wanted&&!playing)start()});label();if(wanted)start();</script><script src="collection.js?v=58"></script><script>function render(){const S=PokeStore,a=S.read(),g=document.getElementById('regions'),lv=S.highest();document.getElementById('highest').textContent='なかまの さいこうレベル：Lv.'+lv;g.replaceChildren();for(const [n,r] of S.regions.entries()){const e=document.createElement('div'),h=document.createElement('h2'),p=document.createElement('p'),bar=document.createElement('progress'),b=document.createElement('button'),count=a.filter(x=>S.inRegion(x.id,n)).length,total=r[2]-r[1]+1,active=S.region()===n;e.style.cssText='background:white;border-radius:16px;padding:14px;border:2px solid '+(active?'#65a477':'#ddd');h.textContent=r[0]+'ちほう';p.textContent=count+' / '+total+' ひき';bar.max=total;bar.value=count;b.style.cssText='font-size:16px;padding:10px;margin-top:12px';b.disabled=active||!S.isUnlocked(n);b.textContent=active?'✓ ぼうけん中':!S.isUnlocked(n)?'🔒 Lv.'+r[3]+' でかいほう':'ここへ いく';b.onclick=()=>{if(S.setRegion(n)){document.getElementById('status').textContent=r[0]+'ちほうに いどうしたよ！';render()}};e.append(h,p,bar,b);g.append(e)}}render();window.addEventListener('pageshow',render)</script></body></html>
