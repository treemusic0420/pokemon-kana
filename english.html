function setup(c){const ctx=c.getContext('2d');let strokes=[],active=null,pid=null;function render(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(c.width,0,0,c.height,0,0);ctx.lineWidth=.065;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle='#2864c7';for(const s of strokes){if(!s.length)continue;ctx.beginPath();ctx.arc(s[0][0],s[0][1],.0325,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(...s[0]);for(const p of s.slice(1))ctx.lineTo(...p);ctx.stroke()}}function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}c.onpointerdown=e=>{e.preventDefault();if(pid!==null||e.pointerType!=='pen')return;pid=e.pointerId;c.setPointerCapture(pid);active=[point(e)];strokes.push(active);render();updateNext()};c.onpointermove=e=>{e.preventDefault();if(e.pointerId!==pid||!active)return;const events=e.getCoalescedEvents?.();for(const p of (events?.length?events:[e]))active.push(point(p));render()};c.onpointerup=c.onpointercancel=c.onlostpointercapture=e=>{if(e.pointerId===pid){pid=null;active=null}};c.hasInk=()=>strokes.some(s=>s.length>0);c.clearInk=()=>{strokes=[];active=null;pid=null;render();updateNext()};c.redraw=render;render();}window.addEventListener('resize',()=>{for(const c of document.querySelectorAll('canvas'))c.redraw?.()});$('clear').onclick=()=>document.querySelectorAll('canvas').forEach(c=>c.clearInk());$('next').onclick=()=>{if($('next').disabled)return;index++;if(index===20){playSound('finish');$('progress').value=20;$('game').hidden=true;$('done').hidden=false;recordStudy();rewardPokemon();$('count').textContent='20 / 20'}else{playSound('next');show()}};$('restart').onclick=start;start();function recordStudy(){const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(day<'2026-11-01'||day>'2027-10-31')return;try{localStorage.setItem('
