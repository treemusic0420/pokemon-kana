<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かだいきょく</title><style>*{box-sizing:border-box}body{background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;margin:0}main{max-width:850px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}button{border:2px solid #d4c6aa;border-radius:14px;background:white;color:inherit;font-size:clamp(18px,4vw,28px);font-weight:bold;padding:14px;touch-action:manipulation}button.active{background:#f8c74e}button:disabled{opacity:.5}#sections,#modes,#keys,#nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}#slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:28px 0}.slot{min-width:54px;padding:15px 8px;background:white;border:2px solid #d4c6aa;border-radius:12px;font-size:28px;font-weight:bold}.slot.ok{background:#d5efda}.slot.current{border-color:#e2a51a;background:#fff0b0}#feedback{min-height:32px;font-weight:bold;font-size:22px}small{display:block;margin-top:30px}a{color:inherit}</style></head><body><main><header><a href="./?v=49">〈 ホーム</a><h1>かだいきょく</h1><button id="bgm" style="font-size:14px">🎵 BGM</button></header><p>ドレミの じゅんばんを おぼえよう！</p><div id="sections"></div><div id="modes"><button id="learn">おぼえる</button><button id="test">あんきテスト</button></div><h2 id="heading"></h2><div id="slots"></div><div id="keys"></div><p id="feedback" aria-live="polite"></p><div id="nav"><button id="prev">〈 まえ</button><button id="retry">もういちど</button><button id="next">つぎ 〉</button></div><section id="done"></section><small>Ver.0.49・試作版（写真からの仮入力）</small></main><script src="melody-data.js?v=49"></script><script src="collection.js?v=49"></script><script src="study-bgm.js?v=49" data-track="kana"></script><script>const $=id=>document.getElementById(id),data=MELODY_DATA;let section='B',phrase=0,mode='learn',pos=0,mistakes=0,correct=0,finished=false;const colors=['#f8cccc','#ffe0b5','#fff0b0','#d5efda','#dce7fa','#e9dafa','#f4d7e8'];function notes(){return data[section][phrase].split(' ')}function reset(){pos=0;finished=false;$('feedback').textContent='';render()}function session(){correct=0;mistakes=0;$('done').replaceChildren();reset()}function render(){$('heading').textContent=section+' − '+(phrase+1)+' / '+data[section].length;$('learn').className=mode==='learn'?'active':'';$('test').className=mode==='test'?'active':'';for(const b of $('sections').children)b.className=b.textContent===section?'active':'';$('slots').replaceChildren();notes().forEach((a,i)=>{const e=document.createElement('span');e.className='slot'+(mode==='learn'||i<pos?' ok':i===pos?' current':'');e.textContent=mode==='learn'||i<pos?a:'？';$('slots').append(e)});$('keys').hidden=mode==='learn';$('prev').disabled=phrase===0;$('next').disabled=mode==='test'&&!finished;$('next').textContent=phrase===data[section].length-1?'さいしょへ':'つぎ 〉'}function pick(a){if(mode!=='test'||finished)return;if(a!==notes()[pos]){mistakes++;$('feedback').textContent='もういちど！';return}pos++;correct++;if(pos===notes().length){finished=true;$('feedback').textContent='⭕ せいかい！'}else $('feedback').textContent='';render();if(correct>=20){if(mistakes<4){const d=PokeStore.day();try{localStorage.setItem('pokemon-kana-study-days-v1:'+d,'1')}catch(e){}rewardPokemon()}else $('done').textContent='まちがいが 4かい いじょう。もういちど がんばろう！';correct=0;mistakes=0}}for(const k of Object.keys(data)){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{section=k;phrase=0;session()};$('sections').append(b)}['ド','レ','ミ','ファ','ソ','ラ','シ'].forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.style.background=colors[i];b.onclick=()=>pick(a);$('keys').append(b)});$('learn').onclick=()=>{mode='learn';session()};$('test').onclick=()=>{mode='test';session()};$('prev').onclick=()=>{phrase--;reset()};$('next').onclick=()=>{phrase=(phrase+1)%data[section].length;reset()};$('retry').onclick=reset;render();</script></body></html>
