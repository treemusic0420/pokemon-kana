<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひらがなれんしゅう</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;font-family:system-ui,sans-serif;color:#514126;text-align:center}main{max-width:900px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(18px,4vw,28px)}progress{width:100%;accent-color:#e5a525;height:14px}.picture{font-size:100px;line-height:1.2;margin:20px auto 8px}h2{margin:8px}.cells{display:flex;justify-content:center;gap:6px;margin:24px 0}.cell{position:relative;width:min(16vw,130px);aspect-ratio:1;background:white;border:2px solid #b5aa91;border-radius:8px;overflow:hidden;display:grid;place-items:center}.cell:before,.cell:after{content:'';position:absolute;pointer-events:none}.cell:before{height:100%;border-left:1px dashed #ddd}.cell:after{width:100%;border-top:1px dashed #ddd}.guide{font-family:'Hiragino Sans',sans-serif;font-size:min(12vw,100px);color:#d3d3d3;line-height:1}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}button{border:0;border-radius:14px;padding:16px 24px;font-size:20px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;margin:5px}button.secondary{background:#e8e0d1}label{display:block;margin:12px;font-size:14px}small{color:#766c59}</style><main><header><h1>ひらがな れんしゅう</h1><b id="count"></b></header><progress id="progress" max="10"></progress><section id="game"><div class="picture" id="picture"></div><h2 id="name"></h2><p>うすい もじを なぞってね！</p><div class="cells" id="cells"></div><button class="secondary" id="clear">かきなおす</button><button id="next">つぎへ →</button><label><input type="checkbox" id="pen"> ペンだけで かく（対応ペン用）</label></section><section id="done" hidden><div class="picture">🏆</div><h2>よくできました！</h2><p>10もん おわったよ！</p><button id="restart">もういちど</button></section><small>試作版：画像は仮の絵文字です。自動採点はありません。</small></main><script>
const data=[{name:'イーブイ',kana:'いーぶい',emoji:'🦊'},{name:'ピカチュウ',kana:'ぴかちゅう',emoji:'⚡'},{name:'カビゴン',kana:'かびごん',emoji:'💤'},{name:'ポッチャマ',kana:'ぽっちゃま',emoji:'🐧'},{name:'ヒトカゲ',kana:'ひとかげ',emoji:'🔥'},{name:'ゼニガメ',kana:'ぜにがめ',emoji:'🐢'},{name:'フシギダネ',kana:'ふしぎだね',emoji:'🌱'},{name:'ニャース',kana:'にゃーす',emoji:'🐱'},{name:'プリン',kana:'ぷりん',emoji:'🎵'},{name:'コダック',kana:'こだっく',emoji:'🐤'},{name:'ミュウ',kana:'みゅう',emoji:'✨'}];
const $=id=>document.getElementById(id);let order=[],index=0;function start(){order=[...data];for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}order=order.slice(0,10);index=0;$('done').hidden=true;$('game').hidden=false;show()}
function show(){ $('count').textContent=(index+1)+' / 10'; $('progress').value=index;const q=order[index];$('picture').textContent=q.emoji;if(q.image){const img=new Image();img.src=q.image;img.style.cssText='max-width:180px;max-height:160px';$('picture').replaceChildren(img)}$('name').textContent=q.name;$('cells').replaceChildren();for(const char of q.kana){const cell=document.createElement('div');cell.className='cell';const guide=document.createElement('span');guide.className='guide';guide.textContent=char;const c=document.createElement('canvas');cell.append(guide,c);$('cells').append(cell);setup(c)}}
function setup(c){const ctx=c.getContext('2d');let strokes=[],active=null,pid=null;function render(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(c.width,0,0,c.height,0,0);ctx.lineWidth=.065;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle='#2864c7';for(const s of strokes){if(!s.length)continue;ctx.beginPath();ctx.arc(s[0][0],s[0][1],.0325,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(...s[0]);for(const p of s.slice(1))ctx.lineTo(...p);ctx.stroke()}}function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}c.onpointerdown=e=>{if(pid!==null||($('pen').checked&&e.pointerType!=='pen'))return;e.preventDefault();pid=e.pointerId;c.setPointerCapture(pid);active=[point(e)];strokes.push(active);render()};c.onpointermove=e=>{if(e.pointerId!==pid||!active)return;const events=e.getCoalescedEvents?.();for(const p of (events?.length?events:[e]))active.push(point(p));render()};c.onpointerup=c.onpointercancel=c.onlostpointercapture=e=>{if(e.pointerId===pid){pid=null;active=null}};c.clearInk=()=>{strokes=[];active=null;pid=null;render()};c.redraw=render;render();}window.addEventListener('resize',()=>{for(const c of document.querySelectorAll('canvas'))c.redraw?.()});$('clear').onclick=()=>document.querySelectorAll('canvas').forEach(c=>c.clearInk());$('next').onclick=()=>{index++;if(index===10){$('progress').value=10;$('game').hidden=true;$('done').hidden=false;$('count').textContent='10 / 10'}else show()};$('restart').onclick=start;start();</script></html>
