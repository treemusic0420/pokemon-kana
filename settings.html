<!doctype html><html lang="ja"><head><link rel="manifest" href="manifest.webmanifest?v=63"><link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ポケモン学習"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff8e5"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まいにち おべんきょう</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:32px auto;max-width:700px}.tile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 10px;background:#ffe3a0}.tile:nth-child(3){background:#d5efda}.tile:nth-child(4){background:#dce7fa}@media(max-width:480px){.tiles{grid-template-columns:1fr}.tile{padding:18px 10px}}.tile:nth-child(2){background:#efd9f4}.symbol{font-size:clamp(30px,7vw,60px)}.tile span:last-child{font-size:16px}.home-title{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.home-title h1{font-size:clamp(20px,4.5vw,32px);margin:0}.home-title img{width:clamp(65px,15vw,120px);height:auto;object-fit:contain;flex-shrink:0}.tile:nth-child(5){background:#d9e9fa}.tile:nth-child(6){background:#ffd9bd}.tile:nth-child(7){background:#e4ecd1;grid-column:1/-1}.musicbar{display:flex;justify-content:flex-end}.musicbar button{font-size:14px;padding:9px 14px;background:#efd9f4}</style></head><body><main><header><a href="./?v=63">〈 ホーム</a><h1>せってい</h1></header><div style="margin:12px auto"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/702.png" alt="デデンネ" draggable="false" style="width:140px;max-width:40%;height:auto;object-fit:contain"></div><p id="status"></p><p>バックアップを保存して、ファイルアプリの iCloud Drive に保管してください。</p><button id="save">バックアップを保存</button><p><strong>バックアップから復元</strong></p><p>下のファイル選択欄から iCloud Drive のバックアップを選んでください。</p><p><input type="file" id="file" aria-label="バックアップファイルを選択" style="display:block;max-width:100%;margin:12px auto;font-size:18px;padding:12px;background:white;border:2px solid #d6b46a;border-radius:12px"></p><p id="msg" role="status"></p><small>Ver.0.63</small></main><script src="collection.js?v=63"></script><script>const S=PokeStore,$=id=>document.getElementById(id),validDay=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);function days(){return Object.keys(localStorage).filter(k=>k.startsWith(S.P)&&localStorage.getItem(k)==='1').map(k=>k.slice(S.P.length))}function render(){$('status').textContent='ポケモン '+S.read().length+'匹 ／ 学習 '+days().length+'日'}$('save').onclick=()=>{try{const data={version:1,pokemon:S.read(),missionCounts:S.counts(),region:S.region(),unlockedRegions:S.unlocked(),stones:S.bag(),party:S.party(),tradeDays:JSON.parse(localStorage.getItem('pokemon-trade-days-v1')||'[]'),days:days(),bgm:localStorage.getItem('pokemon-bgm')||'on'},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='pokemon-backup-'+S.day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('msg').textContent='ファイルを iCloud Drive に保存してください。'}catch(e){$('msg').textContent='保存できませんでした。'}};$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;$('msg').textContent='バックアップを読み込んでいます…';const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsText(f)});const d=JSON.parse(raw);if((d.missionCounts!==undefined&&!S.validCounts(d.missionCounts))||(d.stones!==undefined&&(!d.stones||typeof d.stones!=='object'||Array.isArray(d.stones)||!Object.entries(d.stones).every(([k,v])=>Object.hasOwn(S.stones,k)&&Number.isSafeInteger(v)&&v>=0)))||d.version!==1||!Array.isArray(d.pokemon)||!Array.isArray(d.days)||!d.pokemon.every(x=>x&&Number.isInteger(x.id)&&x.id>=1&&x.id<=S.MAX&&validDay(x.day)&&(x.exp===undefined||(Number.isInteger(x.exp)&&x.exp>=0&&x.exp<=9900))&&(x.friend===undefined||(Number.isInteger(x.friend)&&x.friend>=0&&x.friend<=100)))||(d.party!==undefined&&(!Array.isArray(d.party)||d.party.length>6||!d.party.every(id=>Number.isInteger(id)&&d.pokemon.some(x=>x.id===id))))||(d.tradeDays!==undefined&&(!Array.isArray(d.tradeDays)||!d.tradeDays.every(validDay)))||!d.days.every(validDay)||!['on','off'].includes(d.bgm))throw Error();if(!confirm('現在のデータとバックアップを統合しますか？（パーティー情報がある場合はバックアップの編成に戻します）')){$('msg').textContent='復元をキャンセルしました。';return;}const a=S.read(),ids=new Set(a.map(x=>x.id));for(const x of d.pokemon){if(!ids.has(x.id)){a.push({id:x.id,day:x.day,exp:S.exp(x),friend:S.friend(x),...(validDay(x.friendDay)?{friendDay:x.friendDay}:{}),...(validDay(x.tradeDay)?{tradeDay:x.tradeDay}:{})});ids.add(x.id);}else{const y=a.find(v=>v.id===x.id);y.exp=Math.max(S.exp(y),S.exp(x));y.friend=Math.max(S.friend(y),S.friend(x));if(validDay(x.friendDay)&&(!y.friendDay||x.friendDay>y.friendDay))y.friendDay=x.friendDay;}}localStorage.setItem(S.K,JSON.stringify(a));if(d.party!==undefined)S.saveParty(d.party);if(d.missionCounts!==undefined)S.mergeCounts(d.missionCounts);if(Array.isArray(d.unlockedRegions))S.mergeUnlocked(d.unlockedRegions);else if(Number.isInteger(d.region)&&d.region>=0&&d.region<9)S.mergeUnlocked(Array.from({length:d.region+1},(_,i)=>i));if(d.region!==undefined)S.setRegion(d.region);if(d.stones!==undefined){const b=S.bag();for(const [k,v] of Object.entries(d.stones))b[k]=Math.max(b[k]||0,v);S.saveBag(b)}localStorage.setItem('pokemon-trade-days-v1',JSON.stringify([...new Set([...JSON.parse(localStorage.getItem('pokemon-trade-days-v1')||'[]'),...(d.tradeDays||[]),...d.pokemon.map(x=>x.tradeDay).filter(validDay)])]));for(const day of d.days)localStorage.setItem(S.P+day,'1');localStorage.setItem('pokemon-bgm',d.bgm);render();$('msg').textContent='復元しました。'}catch(e){$('msg').textContent='バックアップを読み込めませんでした。'}finally{$('file').value=''}};render();</script></body></html>
