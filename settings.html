<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まいにち おべんきょう</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{max-width:900px;margin:auto;padding:24px}a{color:inherit}button,.tile{border:0;border-radius:16px;padding:18px;font-size:24px;font-weight:bold;background:#f8c74e;color:#514126;cursor:pointer;text-decoration:none;touch-action:manipulation}small{display:block;margin-top:30px;color:#766c59}header{display:flex;justify-content:space-between;align-items:center}progress{width:100%;accent-color:#65a477;height:14px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:32px auto;max-width:700px}.tile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 10px;background:#ffe3a0}.tile:nth-child(3){background:#d5efda}.tile:nth-child(4){background:#dce7fa}@media(max-width:480px){.tiles{grid-template-columns:1fr}.tile{padding:18px 10px}}.tile:nth-child(2){background:#efd9f4}.symbol{font-size:clamp(30px,7vw,60px)}.tile span:last-child{font-size:16px}.home-title{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.home-title h1{font-size:clamp(20px,4.5vw,32px);margin:0}.home-title img{width:clamp(65px,15vw,120px);height:auto;object-fit:contain;flex-shrink:0}.tile:nth-child(5){background:#d9e9fa}.tile:nth-child(6){background:#ffd9bd}.tile:nth-child(7){background:#e4ecd1;grid-column:1/-1}.musicbar{display:flex;justify-content:flex-end}.musicbar button{font-size:14px;padding:9px 14px;background:#efd9f4}</style></head><body><main><header><a href="./?v=23">〈 ホーム</a><h1>せってい</h1></header><p id="status"></p><p>バックアップを保存して、ファイルアプリの iCloud Drive に保管してください。</p><button id="save">バックアップを保存</button><p><strong>バックアップから復元</strong></p><p>下のファイル選択欄から iCloud Drive のバックアップを選んでください。</p><p><input type="file" id="file" aria-label="バックアップファイルを選択" style="display:block;max-width:100%;margin:12px auto;font-size:18px;padding:12px;background:white;border:2px solid #d6b46a;border-radius:12px"></p><p id="msg" role="status"></p><small>Ver.0.23</small></main><script src="collection.js?v=23"></script><script>const S=PokeStore,$=id=>document.getElementById(id),validDay=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);function days(){return Object.keys(localStorage).filter(k=>k.startsWith(S.P)&&localStorage.getItem(k)==='1').map(k=>k.slice(S.P.length))}function render(){$('status').textContent='ポケモン '+S.read().length+'匹 ／ 学習 '+days().length+'日'}$('save').onclick=()=>{try{const data={version:1,pokemon:S.read(),days:days(),bgm:localStorage.getItem('pokemon-bgm')||'on'},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='pokemon-backup-'+S.day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('msg').textContent='ファイルを iCloud Drive に保存してください。'}catch(e){$('msg').textContent='保存できませんでした。'}};$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;$('msg').textContent='バックアップを読み込んでいます…';const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsText(f)});const d=JSON.parse(raw);if(d.version!==1||!Array.isArray(d.pokemon)||!Array.isArray(d.days)||!d.pokemon.every(x=>x&&Number.isInteger(x.id)&&x.id>=1&&x.id<=S.MAX&&validDay(x.day))||!d.days.every(validDay)||!['on','off'].includes(d.bgm))throw Error();if(!confirm('現在のデータとバックアップを統合しますか？')){$('msg').textContent='復元をキャンセルしました。';return;}const a=S.read(),ids=new Set(a.map(x=>x.id)),dates=new Set(a.map(x=>x.day));for(const x of d.pokemon){if(!ids.has(x.id)&&!dates.has(x.day)){a.push({id:x.id,day:x.day});ids.add(x.id);dates.add(x.day)}}localStorage.setItem(S.K,JSON.stringify(a));for(const day of d.days)localStorage.setItem(S.P+day,'1');localStorage.setItem('pokemon-bgm',d.bgm);render();$('msg').textContent='復元しました。'}catch(e){$('msg').textContent='バックアップを読み込めませんでした。'}finally{$('file').value=''}};render();</script></body></html>
