<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケモンこうかん</title><style>*{box-sizing:border-box}body{background:#fff8e5;color:#514126;font-family:system-ui,sans-serif;text-align:center;margin:0}main{max-width:700px;margin:auto;padding:24px}section{background:white;border-radius:18px;padding:20px;margin:20px 0}button,select,input{max-width:100%;font-size:18px;padding:12px;border-radius:12px}button{background:#f8c74e;border:0;color:inherit;font-weight:bold;margin:6px}button:disabled{opacity:.4}img{width:120px;height:120px;object-fit:contain}a{color:inherit}small{color:#766c59}</style></head><body><main><a href="./?v=43">〈 ホーム</a><h1>🔄 ポケモンこうかん</h1><p id="quota"></p><section><h2>おくる</h2><p>おくっても 自分のポケモンは へらないよ！</p><select id="pick" aria-label="おくるポケモン"></select><div id="preview"></div><button id="share">AirDropで おくる</button><button id="download">ファイルを ほぞん</button><p id="sendStatus" role="status"></p><p>AirDropが使えないときは、保存したファイルを「ファイル」アプリから共有してね。</p></section><section><h2>うけとる</h2><p>1日1ひきまで。もっているポケモンは うけとれないよ。</p><input id="file" type="file" aria-label="こうかんファイルを選ぶ"><p id="receiveStatus" role="status"></p><div id="received"></div></section><small>Ver.0.43</small></main><script src="collection.js?v=43"></script><script>const S=PokeStore,$=id=>document.getElementById(id),T='pokemon-trade-days-v1';function history(){return JSON.parse(localStorage.getItem(T)||'[]')}function used(){return history().includes(S.day())||S.read().some(x=>x.tradeDay===S.day())}function quota(){$('quota').textContent='きょうの うけとり：'+(used()?1:0)+' / 1 ひき';$('file').disabled=used()}const owned=S.read().map(x=>x.id).sort((a,b)=>a-b);for(const id of owned){const o=document.createElement('option');o.value=id;o.textContent='No.'+id;$('pick').append(o);S.name(id).then(n=>o.textContent='No.'+id+' '+n)}const requested=Number(new URLSearchParams(location.search).get('id'));if(owned.includes(requested))$('pick').value=requested;function preview(){const id=Number($('pick').value);$('preview').replaceChildren();if(id)$('preview').append(S.picture(id));$('share').disabled=$('download').disabled=!id}$('pick').onchange=preview;preview();function makeFile(){const id=Number($('pick').value);if(!S.read().some(x=>x.id===id))throw Error();return new File([JSON.stringify({type:'pokemon-kana-trade',version:1,id})],'pokemon-trade-'+id+'.json',{type:'application/json'})}function download(f){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);$('sendStatus').textContent='ファイルアプリから AirDropで おくってね。'}$('download').onclick=()=>{try{download(makeFile())}catch(e){$('sendStatus').textContent='保存できませんでした。'}};$('share').onclick=async()=>{try{const f=makeFile();if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});$('sendStatus').textContent='共有操作が おわったよ。'}else download(f)}catch(e){$('sendStatus').textContent=e.name==='AbortError'?'共有を キャンセルしたよ。':'共有できませんでした。ファイル保存を使ってね。'}};$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsText(f)});const d=JSON.parse(raw);if(d.type!=='pokemon-kana-trade'||d.version!==1||!Number.isInteger(d.id)||d.id<1||d.id>S.MAX)throw Error();const a=S.read();if(a.some(x=>x.id===d.id)){$('receiveStatus').textContent='もう もっているよ！ べつのポケモンを おくってもらおう。';return}if(used()){$('receiveStatus').textContent='きょうは もう うけとったよ。';return}const day=S.day();a.push({id:d.id,day,tradeDay:day});localStorage.setItem(S.K,JSON.stringify(a));localStorage.setItem(T,JSON.stringify([...new Set([...history(),day])]));quota();$('receiveStatus').textContent='🎉 なかまに なったよ！';const n=document.createElement('p');$('received').replaceChildren(S.picture(d.id),n);S.name(d.id).then(v=>n.textContent=v)}catch(e){$('receiveStatus').textContent='ファイルを 読み込めませんでした。'}finally{$('file').value=''}};quota();window.addEventListener('pageshow',quota);window.addEventListener('focus',quota);</script></body></html>
